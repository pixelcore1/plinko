<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Plinko prototype</title>
<link rel="stylesheet" href="../design-system/css/tokens.css">
<link rel="stylesheet" href="../design-system/css/type.css">
<link rel="stylesheet" href="../design-system/css/base.css">
<link rel="stylesheet" href="../design-system/css/components.css">
<link rel="stylesheet" href="../design-system/css/motion.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- Host page: a screenshot of the lobby the game opens over (presentation only, blurred under the scrim). -->
<div class="host" id="host" aria-hidden="true">
  <picture><source media="(min-width: 768px)" srcset="img/host-desktop.webp"><img class="host__shot" src="img/host-mobile.webp" alt=""></picture>
</div>


<!-- The game -->
<div class="game" id="game" data-token-mode="mobile" hidden>
  <div class="game__scrim"></div>
  <section class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="plinko-title">
    <div class="popup__header">
    <header class="popup-header">
      <button class="icon-button" id="btn-sound" type="button" aria-pressed="true" aria-label="Sound"></button>
      <h1 class="popup-header__title" id="plinko-title">Plinko</h1>
      <button class="icon-button" id="btn-close" type="button" aria-label="Close Plinko"></button>
    </header>
    </div>
    <div class="popup__body">
    <div class="prize-strip" id="prize-strip"></div>

    <div class="board" id="board">
      <div class="board__tab board-tabs"><span class="ticket-tab" id="ticket-tab"><span class="ticket-tab__icon"></span><span class="ticket-tab__count" aria-live="polite">5 tickets</span><span class="ticket-tab__gain" aria-hidden="true">+1</span></span><button class="ticket-tab winnings-tab" id="winnings-tab" type="button" aria-haspopup="dialog" hidden><span class="winnings-tab__icon"></span><span class="winnings-tab__total" aria-live="polite"></span><span class="ticket-tab__gain" aria-hidden="true"></span></button></div>
      <div class="frame">
        <div class="frame__board">
          <span class="chute"></span>
          <div class="playfield">
            <div class="chance-strip" aria-hidden="true"></div>
            <div class="bin-row" role="list" aria-label="Prize bins"></div>
            <canvas aria-hidden="true"></canvas>
          </div>
        </div>
        <div class="frame__bulbs" aria-hidden="true"></div>
      </div>
    </div>

    </div>
    <div class="popup__footer">
    <div class="controls" id="controls" data-state="ready">
      <div class="controls__ready">
        <div class="risk-selector" id="risk">
          <div class="risk-selector__track" role="radiogroup" aria-label="Risk level">
            <span class="risk-selector__thumb" aria-hidden="true"></span>
          </div>
          <p class="risk-selector__caption" aria-live="polite"></p>
        </div>
        <button class="button button--primary button--lg is-pulse" id="btn-drop" type="button">
          <span class="button__label">Drop</span><span class="button__sublabel">5 tickets left</span>
          <span class="spinner spinner--md" hidden></span>
        </button>
        <button class="footer-link" id="btn-rules" type="button" aria-haspopup="dialog"></button>
      </div>
      <div class="controls__empty">
        <div class="timer" id="timer" role="timer" aria-live="off">
          <span class="timer__ring"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="fill" cx="22" cy="22" r="19"/></svg></span>
          <span><span class="timer__label">Next free ticket</span><span class="timer__digits">05:12:33</span></span>
        </div>
        <p class="earn-line" id="earn-line"></p>
        <button class="button button--primary button--lg" id="btn-play-games" type="button"><span class="button__label">Play games</span></button>
        <button class="link" id="btn-lobby" type="button">Back to lobby</button>
      </div>
    </div>

    </div>
    <div class="layer" id="layer" hidden></div>
  </section>
  <div id="takeover-root"></div>
</div>
<canvas class="fx-layer" id="fx" aria-hidden="true"></canvas>

<!-- Demo tools for reviewers. Not part of the product. -->
<div class="demo" data-token-mode="mobile">
  <div class="demo__panel" id="demo-panel" hidden>
    <h2>Demo tools</h2>
    <p>Results use the real odds. Force a tier to see rare wins (Big exists on Medium and High).</p>
    <div class="demo__row" id="demo-force">
      <button type="button" data-force="" aria-pressed="true">Random</button>
      <button type="button" data-force="small" aria-pressed="false">Small</button>
      <button type="button" data-force="big" aria-pressed="false">Big</button>
      <button type="button" data-force="mega" aria-pressed="false">Mega</button>
    </div>
    <div class="demo__row">
      <button type="button" id="demo-tickets">+5 tickets</button>
      <button type="button" id="demo-zero">0 tickets</button>
      <button type="button" id="demo-free">Free ticket now</button>
    </div>
    <div class="demo__row">
      <button type="button" id="demo-motion" aria-pressed="false">Reduced motion</button>
      <button type="button" id="demo-debug" aria-pressed="false">Debug</button>
      <button type="button" id="demo-reset">First run again</button>
      <button type="button" id="demo-open">Open Plinko</button>
    </div>
    <p><a href="../design-system/" style="color:inherit">Design system docs</a></p>
  </div>
  <button class="demo__toggle" id="demo-toggle" type="button" aria-expanded="false" aria-controls="demo-panel">Demo</button>
</div>
<div class="debug" id="debug" hidden aria-hidden="true"></div>

<!-- Opened from a file (double click)? Load the sounds inline, because the browser blocks fetch on file:// -->
<script>if (location.protocol === 'file:') document.write('<link rel="stylesheet" href="../design-system/css/fonts-inline.css"><script src="../design-system/js/sfx-data.js"><\/script>');</script>
<!-- js/plinko.js is the bundle of js/main.js and its modules (scripts/build.sh), so the page also works from a file -->
<script src="js/plinko.js" defer></script>
</body>
</html>
